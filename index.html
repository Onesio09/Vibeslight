<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibeslight - Controle Sua Ansiedade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Arial', sans-serif; 
            background: #0a0a0a; 
            color: #fff; 
            text-align: center; 
            overflow-x: hidden;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 28px; margin: 20px 0; color: #FF6B00; }
        .balanca { 
            width: 200px; 
            height: 200px; 
            margin: 30px auto; 
            position: relative;
            animation: tremer 0.5s infinite alternate;
        }
        @keyframes tremer {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }
        .ponteiro {
            width: 4px;
            height: 80px;
            background: #FF0000;
            position: absolute;
            left: 50%;
            top: 20px;
            transform-origin: bottom;
            animation: oscilar 2s ease-in-out infinite;
        }
        @keyframes oscilar {
            0%, 100% { transform: translateX(-50%) rotate(-20deg); }
            50% { transform: translateX(-50%) rotate(20deg); }
        }
        .deterioracao {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 60%, rgba(255,0,0,0.3) 100%);
            animation: pulsar 2s infinite;
            opacity: 0;
        }
        @keyframes pulsar {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
        .timer {
            font-size: 48px;
            color: #FF6B00;
            margin: 20px 0;
            font-weight: bold;
        }
        .cta {
            background: #FF6B00;
            color: #000;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 30px 0;
            text-decoration: none;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
