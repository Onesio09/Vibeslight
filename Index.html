<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Acesso Liberado</title>
  <link rel="preconnect" href="https://omg10.com">
  <meta name="robots" content="noindex">
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    html,body{height:100%}
    body {
      background:#0a0a0a; /* Clareei de #050505 pra #0a0a0a */
      color:#fff;
      font-family:system-ui, -apple-system, Arial, sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    
    /* DETERIORAÇÃO CORRIGIDA: Sem blend-mode. Só opacity. */
    .ruido {
      position:fixed;
      inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity:0;
      z-index:10;
      pointer-events:none;
      animation:ruido 12s linear forwards;
    }
    @keyframes ruido {
      0%,50% { opacity:0 }
      100% { opacity:0.12 } /* Bem sutil pra não escurecer tudo */
    }
    
    /* BALANÇA CORRIGIDA: top:68% + opacity:0.25 = visível */
    .balanca-bg {
      position:fixed;
      left:50%;
      top:68%; /* Desceu mais pra garantir que aparece */
      transform:translate(-50%, -50%);
      z-index:0;
      opacity:0.25; /* Era 0.08. Agora vê até com brilho baixo */
      pointer-events:none;
      width:100%;
      display:flex;
      justify-content:center;
    }
    .balanca-bg svg { width:80%; max-width:400px; height:300px }
    
    #box {
      padding:24px;
      width:100%;
      max-width:380px;
      z-index:5; /* Acima do ruído */
      position:relative;
      /* REMOVI margin-top:-40px. Era isso que sumia com o texto */
    }
    h1 { 
      font-size:22px; 
      line-height:1.3; 
      margin-bottom:16px; 
      font-weight:700;
    }
    #timer { 
      font-size:15px; 
      color:#ff4d00; 
      margin:14px 0; 
      font-weight:600;
      min-height:20px; /* Evita salto quando some */
    }
    #cta {
      display:block;
      background:#00ff88;
      color:#000;
      padding:18px 32px;
      font-size:19px;
      font-weight:800;
      border:none;
      border-radius:14px;
      cursor:pointer;
      text-decoration:none;
      width:100%;
      box-shadow:0 6px 24px rgba(0,255,136,0.35);
      text-transform:uppercase;
      /* CTA JÁ VISÍVEL. JS só troca o texto. */
      opacity:1;
      visibility:visible;
    }
    #cta.espera {
      background:#333;
      color:#666;
      pointer-events:none;
      animation:none;
    }
    #cta.pronto {
      animation:pulse 1.1s infinite;
    }
    @keyframes pulse {
      0%,100% { transform:scale(1) }
      50% { transform:scale(1.02) }
    }
  </style>
</head>
<body>
  <div class="ruido"></div>
  
  <div class="balanca-bg">
    <svg viewBox="0 0 400 320" width="400" height="320" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="188" y="210" width="24" height="90" rx="3" fill="#00ff88"/>
      <ellipse cx="200" cy="300" rx="60" ry="8" fill="#00ff88" opacity="0.3"/>
      <rect x="40" y="150" width="320" height="6" rx="3" fill="#00ff88"/>
      <circle cx="200" cy="153" r="8" fill="#000" stroke="#00ff88" stroke-width="3"/>
      <line x1="75" y1="156" x2="75" y2="190" stroke="#00ff88" stroke-width="2.5"/>
      <path d="M45 190 H105 C108 190 110 192 110 195 L100 225 C99 228 96 230 93 230 H57 C54 230 51 228 50 225 L40 195 C40 192 42 190 45 190 Z" fill="#0a0a0a" stroke="#00ff88" stroke-width="2.5"/>
      <text x="75" y="215" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="900">&lt;/&gt;</text>
      <line x1="325" y1="156" x2="325" y2="190" stroke="#00ff88" stroke-width="2.5"/>
      <path d="M295 190 H355 C358 190 360 192 360 195 L350 225 C349 228 346 230 343 230 H307 C304 230 301 228 300 225 L290 195 C290 192 292 190 295 190 Z" fill="#0a0a0a" stroke="#00ff88" stroke-width="2.5"/>
      <text x="325" y="217" text-anchor="middle" fill="#00ff88" font-size="20" font-weight="900">$</text>
      <rect x="110" y="118" width="180" height="28" rx="14" fill="#00ff88"/>
      <text x="200" y="136" text-anchor="middle" fill="#000" font-size="12" font-weight="900">MEU CÓDIGO = DINHEIRO</text>
    </svg>
  </div>

  <div id="box">
    <h1>Seu acesso está sendo liberado</h1>
    <div id="timer">0.8s</div>
    <a id="cta" class="espera" href="https://omg10.com/4/11025748?ab=A&src=tt&v=5.2" rel="noopener noreferrer">AGUARDE...</a>
  </div>

  <script>
    (function(){
      const cta = document.getElementById('cta');
      const timer = document.getElementById('timer');
      const variant = Math.random() < 0.5 ? 'A' : 'B';
      
      let t = 8;
      const int = setInterval(() => {
        t--;
        if(t <= 0) {
          clearInterval(int);
          timer.style.display = 'none';
          cta.textContent = variant === 'A' ? 'DESBLOQUEAR AGORA' : 'ACESSO LIBERADO';
          cta.href = `https://omg10.com/4/11025748?ab=${variant}&src=tt&v=5.2`;
          cta.classList.remove('espera');
          cta.classList.add('pronto');
        } else {
          timer.textContent = `${(t/10).toFixed(1)}s`;
        }
      }, 100);
      
      // Fallback: se JS travar, libera em 2s
      setTimeout(() => {
        if(cta.classList.contains('espera')) {
          clearInterval(int);
          timer.style.display = 'none';
          cta.textContent = 'ACESSO LIBERADO';
          cta.classList.remove('espera');
          cta.classList.add('pronto');
        }
      }, 2000);
    })();
  </script>
</body>
</html>
